# ZapBot documentation: https://jpereira.github.io/zapbot/
# Published only on releases (vX.Y.Z tag) by .github/workflows/docs.yml.
# To see it locally: make docs
site_name: ZapBot
site_url: https://jpereira.github.io/zapbot/
site_description: WhatsApp bot that recovers deleted and edited messages, downloads videos, creates stickers and more.
site_author: Jorge Pereira
repo_url: https://github.com/jpereira/zapbot
repo_name: jpereira/zapbot
edit_uri: edit/main/docs/

# List of the site's dependencies, not a page
exclude_docs: |
  requirements.txt
  overrides/

# The release workflow fills in the published version
copyright: !ENV [DOCS_COPYRIGHT, "ZapBot (development) · MIT License · Copyright &copy; 2026 Jorge Pereira"]

extra:
  release_tag: !ENV [DOCS_RELEASE_TAG, ""]

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Dark mode / Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Light mode / Modo claro
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest

# Bilingual documentation: English (en_US) is the default (docs/page.md) and Portuguese (pt-BR) sits beside
# (docs/page.pt-BR.md), under /pt-BR/ on the site, with the language selector in the header.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          nav_translations:
            Home: Início
            Installation: Instalação
            Configuration: Configuração
            Settings: Ajustes
            Web interface: Interface web
            Commands: Comandos
            Demo: Demonstração
            Operation: Operação
            API and MCP: API e MCP
            Development: Desenvolvimento
            Record the demo: Gravar a demonstração

extra_css:
  - stylesheets/release-tag.css

extra_javascript:
  - javascripts/new-tab-gifs.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # Anchors like GitHub's (keeps accents): the links work on the site and on GitHub
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

validation:
  links:
    anchors: warn
    unrecognized_links: warn

