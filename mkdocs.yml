# Documentação do ZapBot: https://jpereira.github.io/zapbot/
# Publicada só nas releases (tag vX.Y.Z) pelo .github/workflows/docs.yml.
# Para ver localmente: make docs
site_name: ZapBot
site_url: https://jpereira.github.io/zapbot/
site_description: WhatsApp bot that recovers deleted and edited messages, downloads videos, creates stickers and more.
site_author: Jorge Pereira
repo_url: https://github.com/jpereira/zapbot
repo_name: jpereira/zapbot
edit_uri: edit/main/docs/

# Lista das dependências do site, não é uma página
exclude_docs: |
  requirements.txt

# O workflow da release preenche com a versão publicada
copyright: !ENV [DOCS_COPYRIGHT, "ZapBot (development) · MIT License · Copyright &copy; 2026 Jorge Pereira"]

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Dark mode / Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Light mode / Modo claro
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest

# Documentação bilíngue: o inglês (en_US) é o padrão (docs/pagina.md) e o português (pt-BR) fica ao lado
# (docs/pagina.pt-BR.md), em /pt-BR/ no site, com o seletor de idioma no cabeçalho.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          nav_translations:
            Home: Início
            Installation: Instalação
            Configuration: Configuração
            Commands: Comandos
            Demo: Demonstração
            Operation: Operação
            Development: Desenvolvimento
            Record the demo: Gravar a demonstração

extra_javascript:
  - javascripts/gifs-nova-aba.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # Âncoras como as do GitHub (mantém acentos): os links funcionam no site e no GitHub
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

validation:
  links:
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Installation: instalacao.md
  - Configuration: configuracao.md
  - E-mails: emails.md
