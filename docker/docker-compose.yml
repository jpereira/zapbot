name: zapbot

services:
  zapbot:
    user: "root:root"
    image: zapbot
    container_name: zapbot
    build:
      context: ..
      dockerfile: docker/app/Dockerfile

    hostname: DOCKER:zapbot
    env_file:
      - ../config/.env

    environment:
      # Egress firewall (entrypoint + docker/app/egress-firewall.sh): blocks
      # the access to the internal network and closes yt-dlp's SSRF (/get). Needs the
      # cap_add NET_ADMIN below. Change to 0 to turn off.
      - ZAPBOT_EGRESS_FIREWALL=1

    # NET_ADMIN: only so the egress firewall can apply the iptables rules.
    cap_add:
      - NET_ADMIN

    volumes:
      - app_cache:/app/cache
      - wwebjs_auth:/app/.wwebjs_auth

    working_dir: /app
    restart: unless-stopped

volumes:
  app_cache:
  wwebjs_auth:
