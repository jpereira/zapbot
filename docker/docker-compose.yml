name: zapbot

services:
  zapbot:
    user: "root:root"
    image: zapbot
    container_name: zapbot
    build:
      context: ..
      dockerfile: docker/app/Dockerfile

    hostname: DOCKER:zapbot
    env_file:
      - ../config/.env

    environment:
      # Firewall de egresso (entrypoint + docker/app/egress-firewall.sh): bloqueia
      # o acesso à rede interna e fecha o SSRF do yt-dlp (/get). Precisa do
      # cap_add NET_ADMIN abaixo. Troque para 0 para desligar.
      - ZAPBOT_EGRESS_FIREWALL=1

    # NET_ADMIN: só para o firewall de egresso aplicar as regras de iptables.
    cap_add:
      - NET_ADMIN

    volumes:
      - app_cache:/app/cache
      - wwebjs_auth:/app/.wwebjs_auth

    working_dir: /app
    restart: unless-stopped

volumes:
  app_cache:
  wwebjs_auth:
