# Publica a documentação (docs/ + mkdocs.yml) em https://jpereira.github.io/zapbot/
#
# Só nas releases: roda quando uma tag release-* chega ao GitHub (o bump.sh cria a
# tag; o "git push origin release-X.Y" dispara este workflow). Assim o site sempre
# mostra a versão estável. Pode ser rodado à mão (Actions › Documentação › Run
# workflow), mas só escolhendo uma tag release-*: a partir de um branch ele recusa.
#
# Requer, uma vez: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Documentação

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; uma release nova não cancela a anterior no meio
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Instala o MkDocs Material
        run: pip install -r docs/requirements.txt

      # --strict: link ou âncora quebrados falham a publicação
      - name: Gera o site
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: '1'
          DOCS_COPYRIGHT: 'ZapBot ${{ github.ref_name }} · Licença MIT · Copyright &copy; 2026 Jorge Pereira'

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
