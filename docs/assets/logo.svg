  <circle cx="128" cy="46" r="10" fill="#FFD43B"/>

  <!-- Cabeça do robô -->
  <rect x="70" y="70" width="116" height="84" rx="26" fill="#FFFFFF"/>

  <!-- Orelhas -->
  <rect x="56" y="96" width="14" height="32" rx="7" fill="#FFFFFF"/>
  <rect x="186" y="96" width="14" height="32" rx="7" fill="#FFFFFF"/>

  <!-- Olhos -->
  <circle cx="104" cy="106" r="12" fill="#14532D"/>
  <circle cx="152" cy="106" r="12" fill="#14532D"/>
  <circle cx="108" cy="102" r="4" fill="#FFFFFF"/>
  <circle cx="156" cy="102" r="4" fill="#FFFFFF"/>

  <!-- Sorriso -->
  <path d="M106 132q22 16 44 0" fill="none" stroke="#14532D" stroke-width="7" stroke-linecap="round"/>

  <!-- Selo com o raio (o "zap") -->
