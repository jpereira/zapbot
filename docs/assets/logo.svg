<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="titulo">
  <title id="titulo">ZapBot</title>
  <defs>
    <linearGradient id="balao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43C463"/>
      <stop offset="1" stop-color="#1E8E3E"/>
    </linearGradient>
    <linearGradient id="demonio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0443A"/>
      <stop offset="1" stop-color="#B3171B"/>
    </linearGradient>
  </defs>

  <!-- Balão de conversa, com a ponta embaixo à esquerda -->
  <path fill="url(#balao)" d="M128 20c62 0 108 40 108 92s-46 92-108 92c-14 0-27-2-39-6l-49 26 12-46C27 160 20 137 20 112 20 60 66 20 128 20z"/>

  <!-- O anjo: robô com auréola e asinhas -->
  <!-- Asas -->
  <path fill="#E8F5EC" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" d="M70 88C54 68 30 62 12 72Q12 88 28 92Q20 104 36 108Q30 120 48 122Q54 132 70 130Z"/>
  <path fill="#E8F5EC" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" d="M174 88C190 68 214 62 232 72Q232 88 216 92Q224 104 208 108Q214 120 196 122Q190 132 174 130Z"/>

  <!-- Auréola -->
  <ellipse cx="122" cy="50" rx="30" ry="8" fill="none" stroke="#FFD43B" stroke-width="7"/>

  <!-- Cabeça -->
  <rect x="66" y="66" width="112" height="84" rx="26" fill="#FFFFFF"/>

  <!-- Olhos: um normal e um piscando (o hacker que sabe das coisas) -->
  <circle cx="100" cy="102" r="12" fill="#14532D"/>
  <circle cx="104" cy="98" r="4" fill="#FFFFFF"/>
  <path d="M136 103q12-10 24 0" fill="none" stroke="#14532D" stroke-width="7" stroke-linecap="round"/>

  <!-- Sorriso -->
  <path d="M102 128q20 15 40 0" fill="none" stroke="#14532D" stroke-width="7" stroke-linecap="round"/>

  <!-- O demônio, espiando do lado -->
  <!-- Chifres -->
  <path fill="#B3171B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" d="M170 170c-6-14-4-28 6-38 0 12 6 20 16 24z"/>
  <path fill="#B3171B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" d="M232 170c6-14 4-28-6-38 0 12-6 20-16 24z"/>

  <!-- Cara -->
  <circle cx="201" cy="192" r="38" fill="url(#demonio)" stroke="#FFFFFF" stroke-width="7"/>

  <!-- Sobrancelhas bravas e olhos acesos -->
  <path d="M178 176l17 8M224 176l-17 8" stroke="#3B0A0A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="189" cy="188" r="6" fill="#FFD43B"/>
  <circle cx="213" cy="188" r="6" fill="#FFD43B"/>

  <!-- Sorriso com presas -->
  <path d="M182 204q19 16 38 0" fill="#3B0A0A" stroke="#3B0A0A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M188 206l4 8 4-6zM206 206l4 6 4-8z" fill="#FFFFFF"/>
</svg>
